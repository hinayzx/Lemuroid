# 一键出包：把 Lemuroid 竖屏改成「上半屏画面 / 下半屏手柄」
# 用法：Fork 仓库 → 新建 .github/workflows/build.yml（粘贴本文件）→ Actions 里点 Run workflow
name: Build custom Lemuroid (top-half layout)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lemuroid-cores 是 git 子模块；不递归拉取会直接编译失败
      - name: Checkout (with cores submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu-latest 镜像自带 Android SDK，无需 setup-android（该 action 近期常挂）
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      # 唯一的源码改动：画面固定占上半屏，手柄紧贴其下沿占另一半
      # （原版 gameView.bottom -> leftPad.top：画面高度由手柄高度反推，
      #   比它矮的部分被上下居中，于是顶部留一条灰带）
      - name: Patch GameScreenLayout.kt (top-half layout)
        env:
          B64: ""
        run: |
          printf %s "$B64" | base64 -d > lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/GameScreenLayout.kt
          echo "--- verify patch ---"
          grep -c GAME_HEIGHT_RATIO lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/GameScreenLayout.kt
          wc -l lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/game/GameScreenLayout.kt

      # free = 开源 flavor；bundle = 把核心打进 APK（装完即用，不用联网下核心）
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFreeBundleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-top-half
          path: lemuroid-app/build/outputs/apk/**/*.apk
          if-no-files-found: error
